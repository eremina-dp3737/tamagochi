<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тамагочи</title>
    <script src="index.js" defer></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        label {
            font-size: 40px;
            color: rgb(86, 70, 38);
            display: flex;
            justify-content: center;
        }

        #ACT {
            display: flex;
            justify-content: center;
            font-size: 30px;
            color: rgb(50, 59, 1);

        }

        #action {
            font-size: 40px;
            display: flex;
            justify-content: center;
            width: 500px;
        }

        button {
            display: flex;
            justify-content: center;
            font-size: 40px;
            background-color: goldenrod;
            width: 500px;

        }

        #result {
            font-size: 30px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <label>Ваш персональный питомец</label>
    <p id="ACT">Что сделать?</p>
    <select id="action">
        <option value="Food">Покормить</option>
        <option value="Treat">Дать вкусняшку</option>
        <option value="Play">Поиграть</option>
        <option value="Sleep">Уложить спать</option>
        <option value="Bath">Помыть питомца</option>
        <option value="Walk">Вывести на прогулку</option>
        <option value="Study">Научить командам</option>
        <option value="Shop">Отправить в магазин</option>
    </select>
    <button id="button">Выполнить</button>
    <div class="descript">
        <p id="result"></p>
    </div>
</body>

</html>
